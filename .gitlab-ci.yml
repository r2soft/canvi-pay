stages:
  - test

before_script:
  - docker --version
#  - docker info

test-phpunit:
  stage: test
  script:
    - echo "Construindo a imagem Docker..."
    - sudo docker build -t canvi-pay-tests -f docker/Dockerfile .
    - echo "Instalando dependências com o composer..."
    - sudo docker run --rm -v $(pwd):/app -w /app canvi-pay-tests composer install --no-interaction --no-progress --prefer-dist
    - echo "Executando os testes PHPUnit..."
    - sudo docker run --rm -v $(pwd):/app -w /app canvi-pay-tests ./vendor/bin/phpunit --testsuite canvi-pay --log-junit report.xml
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
